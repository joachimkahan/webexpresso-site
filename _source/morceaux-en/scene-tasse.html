<figure class="objet3d__scene" data-scene-3d="tasse" data-libelle-tourner="3D cup: use the arrow keys to turn it">
    <div class="objet3d__scene-dans">
        <img class="objet3d__repli" src="{{racine}}assets/objets-3d/tasse-repli.webp" width="1200" height="1200" loading="lazy" draggable="false" alt="A cup of white coffee on its saucer, with a heart drawn in the foam.">
    </div>
    <div class="objet3d__teintes" role="group" aria-label="Colour of the cup">
        <button type="button" class="objet3d__teinte objet3d__teinte--creme" data-teinte="creme" aria-pressed="true"><span class="objet3d__teinte-nom">Cream</span></button>
        <button type="button" class="objet3d__teinte objet3d__teinte--faience" data-teinte="faience" aria-pressed="false"><span class="objet3d__teinte-nom">Faience blue</span></button>
        <button type="button" class="objet3d__teinte objet3d__teinte--terre" data-teinte="terre" aria-pressed="false"><span class="objet3d__teinte-nom">Terracotta</span></button>
        <button type="button" class="objet3d__teinte objet3d__teinte--espresso" data-teinte="espresso" aria-pressed="false"><span class="objet3d__teinte-nom">Espresso</span></button>
        <span class="objet3d__teinte-active" aria-hidden="true">Cream</span>
    </div>
    <figcaption class="objet3d__legende"><span class="etiquette etiquette--trait">Demonstration</span> A 3D cup, made for this page.</figcaption>
</figure>
