<figure class="objet3d__scene" data-scene-3d="tasse" data-libelle-tourner="Tasse en 3D : utilisez les flèches pour la faire tourner">
    <div class="objet3d__scene-dans">
        <img class="objet3d__repli" src="{{racine}}assets/objets-3d/tasse-repli.webp" width="1200" height="1200" loading="lazy" draggable="false" alt="Une tasse de café crème posée sur sa soucoupe, un cœur dessiné dans la mousse.">
    </div>
    <div class="objet3d__teintes" role="group" aria-label="Couleur de la tasse">
        <button type="button" class="objet3d__teinte objet3d__teinte--creme" data-teinte="creme" aria-pressed="true"><span class="objet3d__teinte-nom">Crème</span></button>
        <button type="button" class="objet3d__teinte objet3d__teinte--faience" data-teinte="faience" aria-pressed="false"><span class="objet3d__teinte-nom">Bleu faïence</span></button>
        <button type="button" class="objet3d__teinte objet3d__teinte--terre" data-teinte="terre" aria-pressed="false"><span class="objet3d__teinte-nom">Terre cuite</span></button>
        <button type="button" class="objet3d__teinte objet3d__teinte--espresso" data-teinte="espresso" aria-pressed="false"><span class="objet3d__teinte-nom">Espresso</span></button>
        <span class="objet3d__teinte-active" aria-hidden="true">Crème</span>
    </div>
    <figcaption class="objet3d__legende"><span class="etiquette etiquette--trait">Démonstration</span> Une tasse en 3D, faite pour cette page.</figcaption>
</figure>
